services:
  - type: web
    name: fvg-signal-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: LTF
        value: 15m
      - key: SCAN_MINUTES
        value: "15"
      - key: SCAN_WORKERS
        value: "4"
      - key: BINANCE_BASE
        value: https://data-api.binance.vision
      - key: FOREX_PROVIDER
        value: yfinance
      - key: LLM_API_KEY
        sync: false
